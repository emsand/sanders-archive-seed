<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Posting Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#FAF6EC; --surface:#FFFFFF; --surface-alt:#F1EAD9; --border:#E3D8BE;
    --text:#22190F; --text-muted:#786B57; --text-faint:#A99A80;
    --mccray:#B87317; --mccray-soft:#F1DFC0;
    --chillcrew:#D63D14; --chillcrew-soft:#F7D9CC;
    --idea:#7A6FBE; --idea-soft:#E7E3F7;
    --drafted:#2F6FA8; --drafted-soft:#DCEAF6;
    --scheduled:#1E8577; --scheduled-soft:#D8EEE9;
    --posted:#3F8F4F; --posted-soft:#DFF1DE;
    --shadow: 0 1px 2px rgba(30,20,5,.06), 0 6px 20px rgba(30,20,5,.06);
    --radius: 10px;
    font-family:"IBM Plex Sans",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17130D; --surface:#211B12; --surface-alt:#2B2317; --border:#3E3421;
      --text:#F3EBDB; --text-muted:#B7A98D; --text-faint:#83745A;
      --mccray:#E8A03D; --mccray-soft:#3B2E14;
      --chillcrew:#FF6E45; --chillcrew-soft:#3C2015;
      --idea:#B0A5EE; --idea-soft:#2A2547;
      --drafted:#7FBCEE; --drafted-soft:#1B3145;
      --scheduled:#5FD6C4; --scheduled-soft:#123330;
      --posted:#8FDB9A; --posted-soft:#173622;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17130D; --surface:#211B12; --surface-alt:#2B2317; --border:#3E3421;
    --text:#F3EBDB; --text-muted:#B7A98D; --text-faint:#83745A;
    --mccray:#E8A03D; --mccray-soft:#3B2E14;
    --chillcrew:#FF6E45; --chillcrew-soft:#3C2015;
    --idea:#B0A5EE; --idea-soft:#2A2547;
    --drafted:#7FBCEE; --drafted-soft:#1B3145;
    --scheduled:#5FD6C4; --scheduled-soft:#123330;
    --posted:#8FDB9A; --posted-soft:#173622;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{ background:var(--bg); color:var(--text); }
  h1,h2,h3{ font-family:"Big Shoulders Display",system-ui,sans-serif; font-weight:800; letter-spacing:.01em; text-wrap:balance; margin:0; }
  .mono{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; }
  .wrap{ max-width:1080px; margin:0 auto; padding-inline:20px; }
  a{ color:inherit; }

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .top-inner{ padding-block:14px; display:flex; flex-direction:column; gap:12px; }
  .brand-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand-row h1{ font-size:26px; }
  .brand-row .tagline{ color:var(--text-muted); font-size:13px; }
  .counts{ display:flex; gap:8px; flex-wrap:wrap; }
  .count-chip{ background:var(--surface-alt); border:1px solid var(--border); border-radius:999px; padding:4px 10px; font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .count-chip b{ color:var(--text); font-family:"IBM Plex Mono",monospace; }

  .pillbar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .pillbar .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-right:2px; }
  .pill{
    border:1px solid var(--border); background:var(--surface-alt); color:var(--text-muted);
    border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .pill:hover{ border-color:var(--text-faint); }
  .pill.active{ background:var(--text); color:var(--bg); border-color:var(--text); }
  .pill.active.mccray{ background:var(--mccray); border-color:var(--mccray); color:#fff; }
  .pill.active.chillcrew{ background:var(--chillcrew); border-color:var(--chillcrew); color:#fff; }

  .top-actions{ display:flex; gap:8px; align-items:center; }
  button.cta{
    background:var(--text); color:var(--bg); border:none; border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; font-family:inherit;
  }

  /* ---------- up next ---------- */
  .upnext{ padding-block:14px; border-bottom:1px solid var(--border); }
  .upnext h2{ font-size:15px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; }
  .upnext-row{ display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .upnext-card{
    flex:0 0 auto; min-width:200px; max-width:240px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:10px 12px; box-shadow:var(--shadow); border-left:4px solid var(--accent,var(--border));
  }
  .upnext-card .up-date{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--text-muted); }
  .upnext-card .up-title{ font-weight:600; font-size:14px; margin-top:2px; }
  .upnext-empty{ color:var(--text-faint); font-size:13px; }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap:4px; padding-block:10px; }
  .tab-btn{
    background:none; border:none; font-family:"Big Shoulders Display",sans-serif; font-weight:800;
    font-size:16px; letter-spacing:.03em; text-transform:uppercase; color:var(--text-faint);
    padding:8px 14px; cursor:pointer; border-bottom:3px solid transparent;
  }
  .tab-btn.active{ color:var(--text); border-bottom-color:var(--text); }

  main{ padding-block:20px 60px; }
  section[data-panel]{ display:flex; flex-direction:column; gap:26px; }

  /* ---------- quick add ---------- */
  .quickadd{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  }
  .quickadd h3{ font-size:16px; }
  .qa-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); }
  .field input, .field select, .field textarea{
    background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:7px 9px;
    font-family:inherit; font-size:13px; color:var(--text); width:100%;
  }
  .field textarea{ resize:vertical; min-height:60px; }

  /* ---------- calendar ---------- */
  .cal-group h2{ font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .cal-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }

  .post-card{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent,var(--border));
    border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .post-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .post-meta{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); }
  .post-date{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .post-title{ font-weight:700; font-size:15px; line-height:1.25; }
  .status-pill{ font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap; }
  .status-idea{ background:var(--idea-soft); color:var(--idea); }
  .status-drafted{ background:var(--drafted-soft); color:var(--drafted); }
  .status-scheduled{ background:var(--scheduled-soft); color:var(--scheduled); }
  .status-posted{ background:var(--posted-soft); color:var(--posted); }

  details.body-copy{ font-size:13px; }
  details.body-copy summary{ cursor:pointer; color:var(--text-muted); font-size:12px; }
  .caption-block{ white-space:pre-wrap; margin-top:8px; line-height:1.5; }
  .hashtag-block{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--text-muted); margin-top:8px; word-break:break-word; }
  .pinned-block{ margin-top:8px; font-size:12.5px; color:var(--text-muted); border-left:2px solid var(--border); padding-left:8px; }
  .asset-block{ margin-top:8px; padding:8px 10px; background:var(--surface-alt); border:1px solid var(--border); border-radius:8px; }
  .asset-block .mono{ font-size:11.5px; color:var(--text-muted); word-break:break-all; }
  .asset-block a{ font-size:12.5px; font-weight:600; text-decoration:underline; }
  .card-actions{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  button.copy-btn{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:6px; color:var(--text);
    font-size:11.5px; padding:5px 9px; cursor:pointer; font-family:inherit; position:relative;
  }
  button.copy-btn.copied{ background:var(--posted-soft); color:var(--posted); border-color:var(--posted); }
  select.status-select{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:6px; padding:5px 7px;
    font-size:11.5px; font-family:inherit; color:var(--text);
  }

  /* ---------- tracker ---------- */
  .kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:760px){ .kanban{ grid-template-columns:1fr; } }
  .kcol{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .kcol-head{ display:flex; align-items:center; justify-content:space-between; padding-bottom:6px; border-bottom:3px solid var(--accent2,var(--border)); }
  .kcol-head h3{ font-size:16px; text-transform:uppercase; }
  .kcol-count{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--text-muted); }
  .kcol-body{ display:flex; flex-direction:column; gap:10px; }
  .kcol-empty{ color:var(--text-faint); font-size:12px; padding:10px; border:1px dashed var(--border); border-radius:8px; }

  /* ---------- library ---------- */
  .lib-brand h2{ font-size:20px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .lib-brand h2 .swatch{ width:12px; height:12px; border-radius:3px; display:inline-block; }
  .lib-kind{ margin-bottom:16px; }
  .lib-kind h3{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; }
  .lib-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .lib-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:12px 14px; display:flex; flex-direction:column; gap:6px;
  }
  .lib-card .lib-title{ font-weight:700; font-size:14px; }
  .lib-card .lib-content{ white-space:pre-wrap; font-size:12.5px; color:var(--text-muted); line-height:1.5; max-height:180px; overflow-y:auto; }
  .lib-search{ margin-bottom:14px; }
  .lib-search input{
    width:100%; max-width:320px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-family:inherit; font-size:13px; color:var(--text);
  }

  .loading, .nodb{ padding:60px 20px; text-align:center; color:var(--text-muted); }
  .toast{
    position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:50;
  }
  .toast.show{ opacity:1; }
  [hidden]{ display:none !important; }
</style>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand-row">
      <div>
        <h1>Posting Desk</h1>
        <div class="tagline">McCray Learning Lab + Chill Crew, one shared calendar</div>
      </div>
      <div class="counts" id="countChips"></div>
    </div>
    <div class="pillbar" id="brandPills">
      <span class="label">Brand</span>
    </div>
    <div class="pillbar" id="statusPills">
      <span class="label">Status</span>
    </div>
    <div class="top-actions">
      <button class="cta" id="toggleAdd" type="button">+ New post</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="quickadd" id="quickAdd" hidden>
    <h3>New post</h3>
    <form id="addForm">
      <div class="qa-grid">
        <div class="field"><label for="qa-brand">Brand</label>
          <select id="qa-brand" required>
            <option value="mccray">McCray Learning Lab</option>
            <option value="chillcrew">Chill Crew</option>
          </select>
        </div>
        <div class="field"><label for="qa-category">Category</label><input id="qa-category" placeholder="episode, spotlight, community…" required></div>
        <div class="field"><label for="qa-platform">Platform</label><input id="qa-platform" placeholder="Instagram, YouTube…" required></div>
        <div class="field"><label for="qa-status">Status</label>
          <select id="qa-status">
            <option value="idea">Idea</option>
            <option value="drafted">Drafted</option>
            <option value="scheduled">Scheduled</option>
            <option value="posted">Posted</option>
          </select>
        </div>
        <div class="field"><label for="qa-datelabel">Date (label)</label><input id="qa-datelabel" placeholder="Thu Oct 15"></div>
        <div class="field"><label for="qa-sortdate">Date (for sorting)</label><input id="qa-sortdate" type="date"></div>
      </div>
      <div class="field"><label for="qa-title">Title</label><input id="qa-title" placeholder="Post title" required></div>
      <div class="field"><label for="qa-caption">Caption</label><textarea id="qa-caption" placeholder="Full caption text…"></textarea></div>
      <div class="qa-grid">
        <div class="field"><label for="qa-hashtags">Hashtags</label><input id="qa-hashtags" placeholder="#ChillCrew #Anime"></div>
        <div class="field"><label for="qa-pinned">Pinned comment</label><input id="qa-pinned" placeholder="optional"></div>
      </div>
      <div class="card-actions">
        <button class="cta" type="submit">Add post</button>
        <button class="ghost" type="button" id="cancelAdd">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="wrap upnext">
  <h2>Up next</h2>
  <div class="upnext-row" id="upNextRow"></div>
</div>

<div class="wrap tabs">
  <button class="tab-btn active" data-panel="calendar">Calendar</button>
  <button class="tab-btn" data-panel="tracker">Tracker</button>
  <button class="tab-btn" data-panel="library">Library</button>
</div>

<main class="wrap">
  <div id="loadingMsg" class="loading">Loading the posting desk…</div>

  <section data-panel="calendar" hidden></section>
  <section data-panel="tracker" hidden></section>
  <section data-panel="library" hidden></section>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STATUSES = ["idea","drafted","scheduled","posted"];
  var STATUS_LABEL = {idea:"Idea", drafted:"Drafted", scheduled:"Scheduled", posted:"Posted"};
  var BRAND_LABEL = {mccray:"McCray Learning Lab", chillcrew:"Chill Crew"};

  // ---------------------------------------------------------------
  // Real seed content. McCray Learning Lab captions/hashtags are
  // verbatim from facebook-kit/CAPTIONS.md (Aug 17, 2026 truth-in-copy
  // rule: 25 stories, six free forever). Chill Crew captions are
  // verbatim from docs-as-received/ChillCrew_Social_Copy_Pack.md, with
  // every date recomputed against the real Oct 1, 2026 premiere
  // (CHILL-CREW-CURRENT.md, updated Sep 17 — pushed back two weeks from
  // the pack's original Sep 17 dates: +7 on Sep 12, +7 again on Sep 17).
  // ---------------------------------------------------------------

  var MCCRAY_ANNOUNCEMENT = "Every kid runs into moments bigger than they are. A missed shot, the night before a new school, a friend who suddenly goes quiet. 💛\n\nThe McCray Learning Lab turns those moments into short, warm story-comics kids can play through on their own or right beside a grown-up. A friendly voice reads every word out loud, and, one calm choice at a time, they rehearse the skill for real life.\n\n25 stories. Read aloud. Six free forever, no account needed.\n▶️ Start free: mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_WHATSINSIDE = "What's inside every McCray Learning Lab comic? 👇\n\n🔊 Read aloud to every child\n⭐ A Word Power vocabulary moment\n👆 Tap to play, no reading required\n🔒 Private: no ads, no tracking\n💛 Warm, and always on the child's side\n\nSix stories free forever → mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_KAI = "New kid. Big dreams. Loud doubts. ⚡🏀\n\nKai has three weeks until basketball tryouts, and he's behind. Level Up Your Mind Game is the story of how he trains the one thing most players never do: the mind game. 🧠\n\nA growth-mindset comic for ages 10-16. Read aloud, and free forever.\n▶️ mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_MICAH = "When Micah's dog Biscuit dies, the water bowl by the door is still full. 💛\n\nKeep the Love is a gentle story about grief. Auntie Nia doesn't try to make the sad go away. She shows Micah something truer: love doesn't leave. We learn to carry it.\n\nA tender read-aloud for ages 6-12, part of the Lab membership. Start with the six free stories and see if the Lab is your family's kind of place.\n▶️ mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_MALIK = "Malik really wants to finish his first big chapter book. 📖 …but every time, the tablet lights up. 📱\n\nThe Finish Muscle is about focus and reading stamina, built one page at a time. For ages 7-11, read aloud, in the Lab membership.\n▶️ Start with the free stories: mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_RILEY = "Riley's jump shot won't fall. 🏀 Her coach says the fix isn't in her hands. It's in her head.\n\nTrain Like a Champion is a growth-mindset sports story for ages 7-11, guided by Sprout. Read aloud, and free forever.\n▶️ mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_DEJA = "Every tricky word is a case to crack. 🔎\n\nIn Word Detective, Deja turns reading into detective work: clues, hunches, and \"aha!\" moments on every page. For ages 6-10, read aloud, in the Lab membership.\n▶️ Start with the free stories: mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_REEL_KIDS = "Watch what happens when a kid picks the \"wrong\" answer. 👀\n\nNothing breaks. Nobody's scolded. It just says \"Not quite, try again!\" and lets them try. That's the whole idea: a safe place to practice a big feeling before it happens for real. 💛\n\nA friendly voice reads every word, and the kid makes the choices. 🔊👆 No reading required, and six full stories are free forever, no sign-up at all.\n▶️ mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_REEL_GROWNUPS = "This one's not for your kid. It's for you. 🍎\n\nYour child comes home deflated. What do you say first? The Grown-Up stories put you in the choice seat, and if the first thing you'd say isn't the one that helps, you just… try again. No judgment, no lecture.\n\nPractice the hard conversations before you're in one. The Grown-Up series is part of the Lab membership; the six free stories show you exactly how it feels.\n▶️ mccraylearninglab.com (IG: link in bio)";
  var MCCRAY_STORYFRAME = "Story-comics for big feelings 💛\n25 stories · six free forever · read aloud\n👆 Tap to start (add the link sticker)";

  var SEED_POSTS = [
    // ---- McCray Learning Lab: 2-week evergreen posting rhythm ----
    {brand:"mccray", category:"Announcement", platform:"Facebook + Instagram", title:"Big Feelings (Announcement)", dateLabel:"Wk1 Mon", status:"drafted", caption:MCCRAY_ANNOUNCEMENT, hashtags:"#McCrayLearningLab #SEL #GrowthMindset #ReadAloud #KidsBooks"},
    {brand:"mccray", category:"Gameplay Reel", platform:"Facebook + Instagram Reel", title:"Gameplay Reel — Word Detective", dateLabel:"Wk1 Tue", status:"drafted", caption:MCCRAY_REEL_KIDS, hashtags:"#McCrayLearningLab #ReadingComprehension #EarlyReaders #Phonics"},
    {brand:"mccray", category:"Spotlight · FREE", platform:"Facebook + Instagram", title:"Spotlight — Level Up Your Mind Game (Kai)", dateLabel:"Wk1 Wed", status:"drafted", caption:MCCRAY_KAI, hashtags:"#McCrayLearningLab #YouthBasketball #KidsSports #MindsetMatters"},
    {brand:"mccray", category:"What's Inside", platform:"Instagram", title:"What's Inside Every Comic?", dateLabel:"Wk1 Thu", status:"drafted", caption:MCCRAY_WHATSINSIDE, hashtags:"#McCrayLearningLab #EdTechForKids #LearningThroughStories"},
    {brand:"mccray", category:"Spotlight · Membership", platform:"Facebook + Instagram", title:"Spotlight — Keep the Love (Micah)", dateLabel:"Wk1 Fri", status:"drafted", caption:MCCRAY_MICAH, hashtags:"#McCrayLearningLab #ChildhoodGrief #GriefSupport #PetLoss"},
    {brand:"mccray", category:"Story", platform:"Facebook + Instagram Story", title:"Story Frame (link sticker)", dateLabel:"Wk1 Sat", status:"drafted", caption:MCCRAY_STORYFRAME, hashtags:"#McCrayLearningLab #SEL"},
    {brand:"mccray", category:"Spotlight · Membership", platform:"Facebook + Instagram", title:"Spotlight — Word Detective (Deja)", dateLabel:"Wk2 Mon", status:"drafted", caption:MCCRAY_DEJA, hashtags:"#McCrayLearningLab #ReadingComprehension #EarlyReaders"},
    {brand:"mccray", category:"Gameplay Reel", platform:"Facebook + Instagram Reel", title:"Gameplay Reel — Keep the Love", dateLabel:"Wk2 Tue", status:"drafted", caption:MCCRAY_REEL_KIDS, hashtags:"#McCrayLearningLab #ChildhoodGrief #GriefSupport"},

  function esc(s){

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 1400);
  }

  function copyText(btn, text){
    function ok(){
      btn.classList.add("copied");
      var old = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(function(){ btn.classList.remove("copied"); btn.textContent = old; }, 1200);
    }
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(ok).catch(function(){ toast("Copy failed — select and copy manually"); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        ok();
      }
    } catch(e){ toast("Copy failed — select and copy manually"); }
  }

  // Real, ready-to-use pointer to the actual file/folder/CDN URL for an
  // item — a clickable "Open" link when it's a real http(s) URL (Chill
  // Crew's CloudFront masters), otherwise the exact local path plus a
  // one-click copy (paste into Explorer's address bar to jump straight
  // there) since a hosted page can't open a local file directly.
  function assetActionsHTML(link){
    if (!link) return "";
    var isUrl = /^https?:\/\//i.test(link);
    var lastSeg = link.split(/[\\\/]/).pop();
    var looksLikeFile = !isUrl && /\.[a-zA-Z0-9]{2,5}$/.test(lastSeg);
    var folder = looksLikeFile ? link.slice(0, link.length - lastSeg.length).replace(/[\\\/]$/, "") : "";
    var html = '<div class="asset-block">';
    html += isUrl
      ? '<a href="'+esc(link)+'" target="_blank" rel="noopener">Open asset ↗</a>'
      : '<span class="mono">'+esc(link)+'</span>';
    html += '<div class="card-actions">';
    html += '<button class="copy-btn" data-value="'+esc(link)+'">'+(isUrl ? "Copy link" : "Copy path")+'</button>';
    if (folder) html += '<button class="copy-btn" data-value="'+esc(folder)+'">Copy folder</button>';
    html += '</div></div>';
    return html;
  }

  function wireCard(container){

        var id = card.getAttribute("data-id");
        var p = posts.filter(function(x){ return x.id === id; })[0];
        if (!p) return;
        var kind = btn.getAttribute("data-copy");
        var text = kind === "caption" ? (p.caption||"") : kind === "hashtags" ? (p.hashtags||"") : (p.pinned||"");
        copyText(btn, text);
      });
    });
    container.querySelectorAll(".status-select").forEach(function(sel){
      sel.addEventListener("change", function(){
        updateStatus(sel.getAttribute("data-id"), sel.value);
      });
    });
    wireValueCopyButtons(container);

      input.addEventListener("input", function(){ renderLibrary(); });
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    panel.querySelectorAll("[data-lib]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-lib");
        var item = library.filter(function(x){ return x.id === id; })[0];
        if (item) copyText(btn, item.content);
      });
    });
    wireValueCopyButtons(panel);
  }

  function renderUpNext(){
    var row = document.getElementById("upNextRow");
    var upcoming = posts.filter(function(p){ return p.sortDate && p.status !== "posted"; })
      .sort(function(a,b){ return a.sortDate < b.sortDate ? -1 : 1; })
      .slice(0,6);
    if (!upcoming.length){
      row.innerHTML = '<div class="upnext-empty">Nothing scheduled yet.</div>';
      return;
    }
    row.innerHTML = upcoming.map(function(p){
      return '<div class="upnext-card" style="--accent:'+accentFor(p.brand)+'">' +
        '<div class="up-date">'+esc(p.dateLabel||p.sortDate)+'</div>' +
        '<div class="up-title">'+esc(p.title)+'</div>' +
        '<span class="status-pill status-'+p.status+'">'+STATUS_LABEL[p.status]+'</span>' +
      '</div>';
    }).join("");
  }

  function renderTabs(){
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      var isActive = btn.getAttribute("data-panel") === activeTab;
      btn.classList.toggle("active", isActive);
    });
    document.querySelectorAll("section[data-panel]").forEach(function(sec){
      sec.hidden = sec.getAttribute("data-panel") !== activeTab;
    });
  }

  function renderAll(){
    renderChips();
    renderPills();
    renderUpNext();
    renderCalendar();
    renderTracker();
    renderLibrary();
    renderTabs();
  }

  // ---------------------------------------------------------------
  // Tabs, quick-add wiring
  // ---------------------------------------------------------------
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      activeTab = btn.getAttribute("data-panel");
      renderTabs();
    });
  });

  var quickAdd = document.getElementById("quickAdd");
  document.getElementById("toggleAdd").addEventListener("click", function(){
    quickAdd.hidden = !quickAdd.hidden;
  });
  document.getElementById("cancelAdd").addEventListener("click", function(){
    quickAdd.hidden = true;
  });
  document.getElementById("addForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    if (!db){ toast("Not connected — can't add a post right now"); return; }
    var sortDateVal = document.getElementById("qa-sortdate").value || null;
    var data = {
      brand: document.getElementById("qa-brand").value,
      category: document.getElementById("qa-category").value,
      platform: document.getElementById("qa-platform").value,
      title: document.getElementById("qa-title").value,
      dateLabel: document.getElementById("qa-datelabel").value || sortDateVal || "",
      sortDate: sortDateVal,
      status: document.getElementById("qa-status").value,
      caption: document.getElementById("qa-caption").value,
      hashtags: document.getElementById("qa-hashtags").value,
      pinned: document.getElementById("qa-pinned").value,
      createdAt: Date.now(), updatedAt: Date.now()
    };
    db.collection("posts").add(data).then(function(){
      ev.target.reset();
      quickAdd.hidden = true;
      toast("Post added");
    }).catch(function(){ toast("Couldn't add — try again"); });
  });

  // ---------------------------------------------------------------
  // Boot: connect db, seed once, subscribe
  // ---------------------------------------------------------------
  function subscribe(){
    db.collection("posts").onSnapshot(function(snap){
      posts = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      document.getElementById("loadingMsg").hidden = true;
      renderAll();
    }, function(){ toast("Live updates interrupted"); });

    db.collection("library").onSnapshot(function(snap){
      library = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){});
  }

  function seedIfNeeded(){
    return db.doc("meta/seeded").get().then(function(snap){
      if (snap.exists) return;
      var chain = Promise.resolve();
      SEED_POSTS.forEach(function(p){
        chain = chain.then(function(){
          var data = Object.assign({createdAt: Date.now(), updatedAt: Date.now()}, p);
          if (data.sortDate === undefined) data.sortDate = null;
          return db.collection("posts").add(data);
        });
      });
      SEED_LIBRARY.forEach(function(item){
        chain = chain.then(function(){ return db.collection("library").add(item); });
      });
      return chain.then(function(){
        return db.doc("meta/seeded").set({seeded:true, seededAt: Date.now()});
      });
    });
  }

  // v2 seed: patches real asset paths onto posts seeded by v1 (matched
  // by title, since those documents already exist and won't be touched
  // by seedIfNeeded again), then adds the new Reel/launch posts and the
  // script-card library. Guarded separately so a desk that already ran
  // v1 picks up v2 exactly once, without re-adding the v1 set.
  function seedV2IfNeeded(){
    return db.doc("meta/seeded_v2").get().then(function(snap){
      if (snap.exists) return;
      var chain = Promise.resolve();
      ASSET_PATCHES.forEach(function(patch){
        chain = chain.then(function(){
          return db.collection("posts").where("title","==",patch.title).get().then(function(qs){
            var inner = Promise.resolve();
            qs.docs.forEach(function(d){
              inner = inner.then(function(){
                var update = {assetLink: patch.assetLink, updatedAt: Date.now()};
                if (patch.notes) update.notes = patch.notes;
                return db.collection("posts").doc(d.id).update(update);
              });
            });
            return inner;
          });
        });
      });
      SEED_POSTS_V2.forEach(function(p){
        chain = chain.then(function(){
          var data = Object.assign({createdAt: Date.now(), updatedAt: Date.now(), sortDate: null}, p);
          return db.collection("posts").add(data);
        });
      });
      SEED_LIBRARY_V2.forEach(function(item){
        chain = chain.then(function(){ return db.collection("library").add(item); });
      });
      return chain.then(function(){
        return db.doc("meta/seeded_v2").set({seeded:true, seededAt: Date.now()});
      });
    });
  }

  // v3: patches real asset paths/CDN links onto posts and script cards
  // seeded by v1/v2 (title-matched, since those documents already
  // exist), then adds the individual brand-asset + quick-folder
  // library entries. Same once-only guard pattern as v2.
  function seedV3IfNeeded(){
    return db.doc("meta/seeded_v3").get().then(function(snap){
      if (snap.exists) return;
      var chain = Promise.resolve();
      ASSET_PATCHES_V3.forEach(function(patch){
        chain = chain.then(function(){
          return db.collection("posts").where("title","==",patch.title).get().then(function(qs){
            var inner = Promise.resolve();
            qs.docs.forEach(function(d){
              inner = inner.then(function(){
                return db.collection("posts").doc(d.id).update({assetLink: patch.assetLink, updatedAt: Date.now()});
              });
            });
            return inner;
          });
        });
      });
      LIBRARY_PATCHES_V3.forEach(function(patch){
        chain = chain.then(function(){
          return db.collection("library").where("title","==",patch.title).get().then(function(qs){
            var inner = Promise.resolve();
            qs.docs.forEach(function(d){
              inner = inner.then(function(){
                return db.collection("library").doc(d.id).update({content: patch.content, assetLink: patch.assetLink});
              });
            });
            return inner;
          });
        });
      });
      SEED_LIBRARY_V3.forEach(function(item){
        chain = chain.then(function(){ return db.collection("library").add(item); });
      });
      return chain.then(function(){
        return db.doc("meta/seeded_v3").set({seeded:true, seededAt: Date.now()});
      });
    });
  }

  async function boot(){
    try{
      db = await window.claude.use("db");
    } catch(e){ db = null; }
    if (!db){
      document.getElementById("loadingMsg").className = "nodb";
      document.getElementById("loadingMsg").textContent = "This desk needs the db capability enabled for your account to load or save posts.";
      return;
    }
    try{
      await seedIfNeeded();
      await seedV2IfNeeded();
      await seedV3IfNeeded();
    } catch(e){ /* seeding is best-effort; subscriptions still render whatever exists */ }
    subscribe();
  }

  boot();
})();
</script>

</body></html>
